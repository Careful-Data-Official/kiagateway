[package]
name = "kiagateway"
version = "0.2.0"
edition = "2024"
authors = ["Keegan Bowen <carefuldata@protonmail.com>"]
license = "MIT"
description = "a light and performant TCP domain-based traffic controller"
homepage = "https://carefuldata.com"
repository = "https://github.com/jpegleg/kiagateway"
readme = "README.md"
categories = ["network-programming"]
keywords = ["proxy-routing", "gateway", "domain-based-routing", "tls-passthrough", "proxy"]

[dependencies]
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "io-util", "time", "macros"] }
uuid = { version = "1.29.3", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.2"
jiff = "1.0.2"
